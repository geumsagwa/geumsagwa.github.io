<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>에세이 - 생각을 잇다</title>
        <script>if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light-mode')</script>
<link rel="stylesheet" href="style.css?v=20260504">
<link rel="stylesheet" href="style-pages.css?v=20260905b">
<link rel="stylesheet" href="style-light.css?v=20260905b">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<nav class="menu-bar">
    <a href="index.html" class="menu-logo" aria-label="생각을 잇다 홈">
        <img class="menu-logo-img menu-logo-img--dark" src="Images/logo-saenggak.svg?v=20260328a" alt="" width="200" height="45" decoding="async" />
        <img class="menu-logo-img menu-logo-img--light" src="Images/logo-saenggak-light.svg?v=20260328a" alt="" width="200" height="45" decoding="async" />
    </a>
    <ul class="menu-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="library.html">Library</a></li>
        <li class="active"><a href="blog.html">Blog</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="board.html">Board</a></li>
        <li class="diary-menu" style="display:none"><a href="diary.html">Diary</a></li>
        <li class="admin-menu" style="display:none"><a href="admin.html">관리</a></li>
    </ul>
    <div class="auth-area" id="auth-area"></div>
</nav>

<div class="review-container">

    <div class="review-header">
        <a href="blog.html" class="review-back">← Blog</a>
        <a href="blog.html?category=essay" class="review-category review-category-link">Essay</a>
    </div>

    <article class="review-article" id="essay-article" style="display:none;">

        <div class="review-book-info" style="border-left: 3px solid #8f7d60; padding-left: 1.5rem; margin-bottom: 2rem;">
            <div id="essay-series-badge" style="display:none; margin-bottom:0.5rem;"></div>
            <h1 class="review-book-title" id="essay-title"></h1>
            <time class="review-date" id="essay-date"></time>
        </div>

        <div class="review-body" id="essay-body"></div>

        <div style="margin-top:3rem; text-align:right;">
            <a id="edit-link" href="#" class="blog-write-btn" style="display:none;">수정</a>
        </div>

    </article>

    <div id="essay-loading" style="text-align:center; padding:10vh 0;">
        <p style="color:#555; font-family:'GyeonggiBatang',sans-serif; font-size:0.9rem;">불러오는 중...</p>
    </div>

    <div id="essay-error" style="display:none; text-align:center; padding:10vh 0;">
        <p style="color:#555; font-family:'GyeonggiBatang',sans-serif; font-size:1rem;">에세이를 찾을 수 없습니다.</p>
        <a href="blog.html" style="color:#8f7d60; font-family:'GyeonggiBatang',sans-serif; font-size:0.85rem; text-decoration:none;">← 목록으로 돌아가기</a>
    </div>

</div>

<script src="supabase-config.js"></script>
<script src="auth.js?v=3"></script>
<script src="scroll-forward.js"></script>
<script src="blog-detail-common.js?v=20260823"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    await waitForSiteAuthReady();
    await loadMarkdownPostDetail({
        table: 'essays',
        titleId: 'essay-title',
        dateId: 'essay-date',
        bodyId: 'essay-body',
        loadingId: 'essay-loading',
        articleId: 'essay-article',
        errorId: 'essay-error',
        editorPage: 'essay-editor.html',
        afterRender: (data) => {
            const badge = document.getElementById('essay-series-badge');
            if (badge && data.series) {
                let label = data.series;
                if (data.episode_number) {
                    label += ` 제${data.episode_number}화`;
                }
                badge.style.display = 'block';
                badge.innerHTML = `<span style="display:inline-block; background:#8f7d60; color:#000; font-size:0.75rem; font-weight:700; padding:0.2rem 0.7rem; border-radius:3px; letter-spacing:0.05em;">${label}</span>`;

                // 시리즈 상세에서는 카테고리 링크를 Series 탭으로 전환
                const catLink = document.querySelector('.review-category-link');
                if (catLink) {
                    catLink.textContent = 'Series';
                    catLink.href = 'blog.html?category=series';
                }
            }
        }
    });
});
</script>

</body>
</html>
