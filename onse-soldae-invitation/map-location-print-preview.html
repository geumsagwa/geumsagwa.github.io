<!DOCTYPE html>
<!-- 인쇄용 오시는 길 지도 위에 마커를 두고 하단에 시설명을 붙여 PNG로 캡처하는 미리보기 페이지 -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; img-src 'self' data: https://*.tile.openstreetmap.org; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'">
  <title>오시는 길 지도 캡처</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; }
    #wrap {
      width: 720px;
      background: #fefcfa;
      box-sizing: content-box;
    }
    #map {
      width: 720px;
      height: 380px;
      border-bottom: 1px solid rgba(182, 152, 109, 0.35);
    }
    .facility-name {
      text-align: center;
      padding: 14px 12px 10px;
      font-family: "Noto Sans KR", sans-serif;
      font-size: 21px;
      font-weight: 700;
      color: #2a2622;
      letter-spacing: 0.08em;
      margin: 0;
    }
    .osm-note {
      font-family: "Noto Sans KR", sans-serif;
      font-size: 8px;
      color: #888;
      text-align: center;
      padding: 0 8px 10px;
      margin: 0;
      line-height: 1.4;
    }
    .leaflet-control-attribution { font-size: 10px !important; max-width: 90%; }
    .marker-pin-red {
      background: transparent !important;
      border: none !important;
    }
    .marker-pin-inner {
      display: block;
      width: 22px;
      height: 22px;
      margin: 0 auto;
      background: #e53935;
      border: 2px solid #fff;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="map" aria-hidden="true"></div>
    <p class="facility-name">온세솔대요양원</p>
    <p class="osm-note">지도 데이터 © OpenStreetMap 기여자 · 마커 위치는 현장과 다를 수 있음</p>
  </div>
  <script>
    (function () {
      var lat = 37.30991695526771;
      var lng = 127.00291010754881;
      var map = L.map("map", {
        zoomControl: false,
        scrollWheelZoom: false,
      }).setView([lat, lng], 16);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      }).addTo(map);
      var redIcon = L.divIcon({
        className: "marker-pin-red",
        html: '<span class="marker-pin-inner"></span>',
        iconSize: [26, 34],
        iconAnchor: [13, 34],
      });
      L.marker([lat, lng], { icon: redIcon }).addTo(map);
      window.__MAP_READY__ = true;
    })();
  </script>
</body>
</html>
