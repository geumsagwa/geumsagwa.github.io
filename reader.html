<script>
    // URL?ì„œ epub Storage ê²½ë¡œ ê°€?¸ì˜¤ê¸?    const params = new URLSearchParams(window.location.search);
    const epubPath = params.get('path') || '';
    const bookName = decodeURIComponent(params.get('title') || '');

    // Supabase Storage?ì„œ epub ?Œì¼ ì§ì ‘ ?¤ìš´ë¡œë“œ ??ë¡œë“œ
    async function initReader() {
        try {
            if (!epubPath) {
                document.getElementById('book-title').textContent = 'ì±…ì„ ? íƒ?´ì£¼?¸ìš”';
                return;
            }

            const { data: { session } } = await _supabase.auth.getSession();

            if (!session) {
                document.getElementById('book-title').textContent = 'ë¡œê·¸?¸ì´ ?„ìš”?©ë‹ˆ??;
                return;
            }

            document.getElementById('book-title').textContent = '?¤ìš´ë¡œë“œ ì¤?..';

            console.log('?¤ìš´ë¡œë“œ ?œë„:', epubPath);

            const { data, error } = await _supabase.storage
                .from('epubs')
                .download(epubPath, { cacheControl: 'no-cache' });

            if (error || !data) {
                document.getElementById('book-title').textContent = '?¤ìš´ë¡œë“œ ?¤íŒ¨';
                console.error('?¤ìš´ë¡œë“œ ?¤íŒ¨:', error);
                return;
            }

            console.log('?¤ìš´ë¡œë“œ ?±ê³µ, ?¬ê¸°:', data.size);
            document.getElementById('book-title').textContent = 'ë¡œë”© ì¤?..';

            // ArrayBufferë¡?ë³€?˜í•˜??epub.js??ì§ì ‘ ?„ë‹¬
            const arrayBuffer = await data.arrayBuffer();
            loadEpub(arrayBuffer);
        } catch (err) {
            console.error('ë¦¬ë” ì´ˆê¸°???¤íŒ¨:', err);
            document.getElementById('book-title').textContent = '?¤ë¥˜: ' + err.message;
        }
    }

    async function loadEpub(bookData) {

    // epub ?Œë”ë§?(ArrayBufferë¥?ì§ì ‘ ?´ê¸°)
    const book = ePub();

    // ?ìŠ¤???¤í???(?´ë‘??ë°°ê²½??ë§ê²Œ) - open ?„ì— ?¤ì •
    const rendition = book.renderTo('epub-viewer', {
        width: '100%',
        height: '100%',
        spread: 'always',
        flow: 'paginated'
    });

    rendition.themes.default({
        'body': {
            'color': '#333 !important',
            'background': 'transparent !important',
            'line-height': '1.85 !important',
            'padding': '26px 36px 20px 36px !important',
            'font-family': "'GyeonggiBatang', 'Malgun Gothic', serif !important",
            'font-size': '15px !important',
            'letter-spacing': '0.01em !important',
            'word-spacing': '0.02em !important'
        },
        'p, div, span, li': {
            'color': '#333 !important'
        },
        'p': {
            'text-indent': '1em !important',
            'margin-bottom': '0.3em !important'
        },
        'h1, h2, h3, h4, h5, h6': {
            'color': '#1a1a1a !important',
            'font-weight': '400 !important'
        },
        'h1': {
            'font-size': '1.23em !important'
        },
        'h2': {
            'font-size': '1.1em !important'
        },
        'h3': {
            'font-size': '1.05em !important'
        },
        'a': {
            'color': '#5a6f8a !important'
        },
        'img': {
            'max-width': '100% !important',
            'height': 'auto !important'
        }
    });

    // EPUB ?Œë”ë§???ë¹?ì¤?br, ë¹??”ì†Œ) ?œê±°
    rendition.hooks.content.register(function(contents) {
        const doc = contents.document;
        const body = doc.body;

        // ?€?€ ëª¨ë“  ì±•í„° ë¹?ì¤??„ì „ ?œê±° ??CSSë¡??„ì¹˜ ê°•ì œ ì§€???€?€

        // 1) ë¹??”ì†Œ ?ë³„
        function isEmpty(node) {
            if (node.nodeName === 'BR') return true;
            if (node.nodeType === 3) return node.textContent.trim() === '';
            if (node.nodeType === 1) {
                if (node.nodeName === 'IMG') return false;
                if (node.querySelector && node.querySelector('img')) return false;
                const text = node.textContent.replace(/\u00a0/g, '').trim();
                const cleaned = node.innerHTML.replace(/<br\s*\/?>/gi, '').replace(/&nbsp;/gi, '').trim();
                return text === '' && cleaned === '';
            }
            return false;
        }

        // 2) ì»¨í…Œ?´ë„ˆ ??ëª¨ë“  ë¹?ì¤??„ì „ ?œê±°
        function removeAllEmpties(container) {
            Array.from(container.childNodes).forEach(node => {
                if (isEmpty(node)) node.remove();
            });
        }

        // 3) body ì§ì† + ëª¨ë“  ?˜ìœ„ ì»¨í…Œ?´ë„ˆ + p ?´ë? br ëª¨ë‘ ?œê±°
        removeAllEmpties(body);
        body.querySelectorAll('div, section, article, aside, header, main').forEach(el => {
            removeAllEmpties(el);
        });
        // p ?œê·¸ ?´ë? br ëª¨ë‘ ?œê±° (ë¹?ì¤„ìš© brë§?
        body.querySelectorAll('p').forEach(p => {
            const text = p.textContent.replace(/\u00a0/g, '').trim();
            if (text === '') {
                p.remove();
            } else {
                // p ?œì‘/?ì˜ br ?œê±°
                while (p.firstChild && p.firstChild.nodeName === 'BR') p.firstChild.remove();
                while (p.lastChild && p.lastChild.nodeName === 'BR') p.lastChild.remove();
            }
        });

        // 4) CSSë¡??•í™•???„ì¹˜ ì§€??        //    1????28px (15px * 1.85)
        //    ?œëª©: ?„ì—??3?‰ì§¸ ??padding-top 2?‰ë¶„ = 56px
        //    ë³¸ë¬¸: 5?‰ì§¸ ???œëª© ?„ë˜ 1??ê°„ê²© = 28px
        // ?œëª©(h1~h3)ë§??„ì¹˜ ì¡°ì •, ?¼ë°˜ ë³¸ë¬¸ ?˜ì´ì§€??ê±´ë“œë¦¬ì? ?ŠìŒ
        const style = doc.createElement('style');
        style.textContent = `
            h1, h2, h3 {
                margin-top: 56px !important;
                margin-bottom: 28px !important;
                padding: 0 !important;
            }
            h1 + *, h2 + *, h3 + * {
                margin-top: 0 !important;
            }
        `;
        doc.head.appendChild(style);

        // ?œëª©(h1~h3) ?ì— ?ˆëŠ” ?°ì† br/ë¹??”ì†Œ ?œê±°
        doc.querySelectorAll('h1, h2, h3').forEach(heading => {
            let el = heading.previousSibling;
            while (el) {
                const prev = el.previousSibling;
                if (el.nodeName === 'BR') {
                    el.remove();
                } else if (el.nodeType === 1 && el.innerHTML.trim() === '') {
                    el.remove();
                } else if (el.nodeType === 3 && el.textContent.trim() === '') {
                    el.remove();
                } else {
                    break;
                }
                el = prev;
            }
        });

        // ?œëª© ë°”ë¡œ ??ë¹?ì¤?ìµœë? 6ê°??œê±°
        doc.querySelectorAll('h1, h2, h3').forEach(heading => {
            let el = heading.nextSibling;
            let removed = 0;
            while (el && removed < 6) {
                const next = el.nextSibling;
                if (el.nodeName === 'BR') {
                    el.remove();
                    removed++;
                } else if (el.nodeType === 1 && el.innerHTML.trim() === '') {
                    el.remove();
                    removed++;
                } else if (el.nodeType === 3 && el.textContent.trim() === '') {
                    el.remove();
                } else {
                    break;
                }
                el = next;
            }
        });

        // SVG ?´ë?ì§€??zoom-in ì»¤ì„œ ?œì‹œ
        doc.querySelectorAll('svg image').forEach(function(img) {
            var svg = img.closest('svg');
            if (svg) svg.style.cursor = 'zoom-in';
        });
    });

    try {
        // ArrayBuffer?ì„œ epub ?´ê¸° (?„ë£Œ ?€ê¸?
        await book.open(bookData);
        await rendition.display();
        console.log('epub ?Œë”ë§??„ë£Œ');
    } catch (err) {
        console.error('epub ?Œë”ë§??¤ë¥˜:', err);
        document.getElementById('book-title').textContent = 'ë¡œë”© ?¤íŒ¨ - ?Œì¼???•ì¸?´ì£¼?¸ìš”';
        return;
    }

    // ì±??œëª© + ëª©ì°¨ ë¡œë“œ
    book.ready.then(() => {
        const title = bookName || book.package.metadata.title || '?œëª© ?†ìŒ';
        document.getElementById('book-title').textContent = title;

        // ëª©ì°¨(TOC) ë¡œë“œ
        return book.loaded.navigation;
    }).then(nav => {
        const tocList = document.getElementById('toc-list');

        // "?‘ê???ë§? ??ª©??ëª©ì°¨ ë§??„ì— ì¶”ê? (spine 2ë²ˆì§¸ ??ª©)
        book.loaded.spine.then(() => {
            const authorNote = document.createElement('a');
            authorNote.className = 'toc-item';
            authorNote.textContent = '?‘ê???ë§?;
            authorNote.href = '#';

            const spineItems = book.spine.spineItems;

            const targetHref = spineItems.length > 1 ? spineItems[1].href : null;
            authorNote._href = targetHref;

            authorNote.addEventListener('click', (e) => {
                e.preventDefault();
                if (targetHref) {
                    rendition.display(targetHref);
                }
            });
            tocList.insertBefore(authorNote, tocList.firstChild);
        });

        if (nav && nav.toc) {
            nav.toc.forEach(chapter => {
                const item = document.createElement('a');
                item.className = 'toc-item';
                item.textContent = chapter.label.trim();
                item.href = '#';
                item._href = chapter.href;
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    rendition.display(chapter.href);
                    document.querySelectorAll('.toc-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                });
                tocList.appendChild(item);
            });
        }
    }).catch(err => {
        console.error('ì±??•ë³´ ë¡œë“œ ?¤íŒ¨:', err);
        document.getElementById('book-title').textContent = 'ë¡œë”© ?¤íŒ¨';
    });

    // ?˜ì´ì§€ ?´ë™
    document.getElementById('prev').addEventListener('click', () => {
        rendition.prev();
    });

    document.getElementById('next').addEventListener('click', () => {
        rendition.next();
    });

    // ?¤ë³´???´ë™
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') rendition.prev();
        if (e.key === 'ArrowRight') rendition.next();
    });

    // iframe ?´ë? ?¤ë³´???´ë²¤??    rendition.on('keydown', (e) => {
        if (e.key === 'ArrowLeft') rendition.prev();
        if (e.key === 'ArrowRight') rendition.next();
        if (e.key === 'Escape') closeImageZoom();
    });

    // ?´ë?ì§€ ?•ë? ?¤ë²„?ˆì´ (ë¶€ëª??˜ì´ì§€)
    let zoomOverlay = document.getElementById('epub-zoom-overlay');
    if (!zoomOverlay) {
        zoomOverlay = document.createElement('div');
        zoomOverlay.id = 'epub-zoom-overlay';
        zoomOverlay.style.css?v=20260504Text = 'display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.9);z-index:99999;cursor:zoom-out;justify-content:center;align-items:center;';
        const zoomImg = document.createElement('img');
        zoomImg.id = 'epub-zoom-img';
        zoomImg.style.css?v=20260504Text = 'max-width:92vw;max-height:92vh;object-fit:contain;border-radius:4px;';
        zoomOverlay.appendChild(zoomImg);
        document.body.appendChild(zoomOverlay);
        zoomOverlay.addEventListener('click', closeImageZoom);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeImageZoom();
        });
    }

    function closeImageZoom() {
        const ov = document.getElementById('epub-zoom-overlay');
        if (ov) ov.style.display = 'none';
    }

    // rendition.on('click')?¼ë¡œ ?´ë?ì§€ ?´ë¦­ ê°ì?
    rendition.on('click', (e) => {
        let target = e.target;
        let svg = null;
        let el = target;
        while (el) {
            if (el.tagName && el.tagName.toLowerCase() === 'svg') { svg = el; break; }
            el = el.parentElement;
        }
        if (!svg) return;
        const imgEl = svg.querySelector('image');
        if (!imgEl) return;
        const href = imgEl.getAttributeNS('http://www.w3.org/1999/xlink', 'href')
                  || imgEl.getAttribute('xlink:href')
                  || imgEl.getAttribute('href');
        if (!href) return;

        // blob URL ??ë¶€ëª??˜ì´ì§€??imgë¡??„ë‹¬ ???‘ê·¼ ë¶ˆê??????ˆìœ¼ë¯€ë¡?data URLë¡?ë³€??        const iframeWin = svg.ownerDocument.defaultView;
        iframeWin.fetch(href)
            .then(r => r.blob())
            .then(blob => {
                const reader = new FileReader();
                reader.onload = () => {
                    const zImg = document.getElementById('epub-zoom-img');
                    zImg.src = reader.result;
                    const ov = document.getElementById('epub-zoom-overlay');
                    ov.style.display = 'flex';
                };
                reader.readAsDataURL(blob);
            })
            .catch(() => {
                // fallback: ì§ì ‘ URL ?¬ìš©
                const zImg = document.getElementById('epub-zoom-img');
                zImg.src = href;
                const ov = document.getElementById('epub-zoom-overlay');
                ov.style.display = 'flex';
            });
    });

    // ?˜ì´ì§€ ?´ë™ ??ëª©ì°¨ ?œì„± ??ª© ?…ë°?´íŠ¸
    rendition.on('relocated', (location) => {
        const currentHref = location.start.href;

            item.classList.remove('active');

        // ?„ì¬ ì±•í„°???´ë‹¹?˜ëŠ” ëª©ì°¨ ??ª© ?œì„±??        const tocItems = document.querySelectorAll('.toc-item');
        tocItems.forEach(item => {
            if (item._href && currentHref.includes(item._href)) {
                item.classList.add('active');
            }
        });
    });

    // ì§„í–‰ë¥??œì‹œ
    rendition.on('relocated', (location) => {
        // locationsê°€ ì¤€ë¹„ë˜ë©??•í™•??ì§„í–‰ë¥? ?„ë‹ˆë©??€?µì  ?œì‹œ
        if (book.locations.length()) {

    // locations??ë¹„ë™ê¸°ë¡œ ì²œì²œ???ì„± (ë¡œë”©??ì°¨ë‹¨?˜ì? ?ŠìŒ)

        });
    });
