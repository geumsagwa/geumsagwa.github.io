<head>

    <title>관리자 - 생각을 잇다</title>
    <script>if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light-mode')</script>

    <style>
    .admin-page-tabs { display: flex; gap: 4px; margin-bottom: 24px; background: #f0f2f5; border-radius: 12px; padding: 4px; }
    .admin-page-tab { flex: 1; padding: 10px 20px; border: none; background: transparent; border-radius: 10px; font-size: 14px; font-weight: 600; color: #666; cursor: pointer; transition: all 0.2s; }
    .admin-page-tab:hover { color: #333; }
    .admin-page-tab.active { background: white; color: #1a73e8; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .admin-page-content { display: none; }
    .admin-page-content.active { display: block; }
    .cardnews-list { display: flex; flex-direction: column; gap: 12px; }
    .cardnews-item { background: white; border-radius: 12px; padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; align-items: center; gap: 12px; }
    .cardnews-item .cardnews-info { flex: 1; min-width: 0; }
    .cardnews-item .cardnews-date { font-size: 16px; font-weight: 600; color: #222; }
    .cardnews-item .cardnews-status { font-size: 13px; color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cardnews-item .cardnews-status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; flex-shrink: 0; }
    .cardnews-item .cardnews-status .dot.active { background: #2ecc71; }
    .cardnews-item .cardnews-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .cardnews-item .cardnews-actions a { padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; text-decoration: none; transition: all 0.2s; }
    .btn-view { background: #e8f0fe; color: #1a73e8; }
    .btn-view:hover { background: #d2e3fc; }
    .cardnews-empty { text-align: center; padding: 60px 20px; color: #999; font-size: 15px; }
    .cardnews-viewer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; display: none; align-items: center; justify-content: center; overflow-y: auto; padding: 40px 20px; }
    .cardnews-viewer.open { display: flex; }
    .cardnews-viewer iframe { width: 480px; max-width: 100%; height: 90vh; border: none; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); background: white; }
    .cardnews-viewer .close-btn { position: fixed; top: 20px; right: 30px; background: rgba(0,0,0,0.5); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 24px; cursor: pointer; }
    /* [2026-08-13 4단계] 역할 배지 + 역할 변경 드롭다운 */
    .admin-member-role { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; margin-left: 6px; }
    .admin-member-role.role-member { background: #eef0f3; color: #666; }
    .admin-member-role.role-staff { background: #e8f0fe; color: #1a73e8; }
    .admin-member-role.role-manager { background: #fef7e0; color: #b26a00; }
    .admin-member-role.role-admin { background: #fde8e8; color: #d93025; }
    .admin-role-change { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
    .admin-role-label { font-size: 12px; color: #888; }
    .admin-role-select { padding: 4px 8px; border-radius: 8px; border: 1px solid #ddd; font-size: 13px; color: #333; background: white; cursor: pointer; }
    .admin-role-select:disabled { background: #f5f5f5; color: #999; cursor: not-allowed; }
    </style>
</head>

<!-- 관리자 콘텐츠 -->
<div class="admin-container">

    <!-- 페이지 탭 -->
    <div class="admin-page-tabs">
        <button class="admin-page-tab active" data-page="members">회원 관리</button>
        <button class="admin-page-tab" data-page="cardnews">카드뉴스</button>
    </div>

    <!-- 회원관리 -->
    <div class="admin-page-content active" id="page-members">
        <div class="admin-header">
            <h1 class="admin-title">회원 관리</h1>
            <p class="admin-subtitle">가입 승인 및 회원 현황</p>
        </div>
        <div class="admin-tabs">
            <button class="admin-tab active" data-filter="all">전체</button>
            <button class="admin-tab" data-filter="pending">대기 <span class="admin-tab-count" id="count-pending">0</span></button>
            <button class="admin-tab" data-filter="approved">승인</button>
            <button class="admin-tab" data-filter="rejected">거절</button>
        </div>
        <div class="admin-list" id="admin-list">
            <!-- JS로 렌더링 -->
        </div>
    </div>

    <!-- 카드뉴스 -->
    <div class="admin-page-content" id="page-cardnews">
        <div class="admin-header">
            <h1 class="admin-title">📰 카드뉴스</h1>
            <p class="admin-subtitle">게발이 브리핑으로 자동 생성된 카드뉴스</p>
        </div>
        <div class="cardnews-list" id="cardnews-list">
            <!-- JS로 렌더링 -->
        </div>
    </div>

</div>

<!-- 카드뉴스 뷰어 (모달) -->
<div class="cardnews-viewer" id="cardnews-viewer">
    <button class="close-btn" onclick="closeCardnewsViewer()">✕</button>
    <iframe id="cardnews-iframe"></iframe>
</div>

<script src="supabase-config.js"></script>
