<link rel="stylesheet" href="style-light.css?v=20260504">

</head>
<body>

<!-- 상단 메뉴바 영역 -->
<nav class="menu-bar">
    <a href="index.html" class="menu-logo" aria-label="생각을 잇다 홈">
        <img class="menu-logo-img menu-logo-img--dark" src="Images/logo-saenggak.svg?v=20260328a" alt="" width="200" height="45" decoding="async" />
        <img class="menu-logo-img menu-logo-img--light" src="Images/logo-saenggak-light.svg?v=20260328a" alt="" width="200" height="45" decoding="async" />
    </a>
    <ul class="menu-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="library.html">Library</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li class="active"><a href="board.html">Board</a></li>
        <li class="diary-menu" style="display:none"><a href="diary.html">Diary</a></li>
        <li class="admin-menu" style="display:none"><a href="admin.html">관리</a></li>
    </ul>
    <div class="auth-area" id="auth-area"></div>
</nav>

<!-- Board 콘텐츠 영역 -->
<div class="board-container">

    <!-- 테마 문구 -->
    <div class="board-theme">
        <p class="board-theme-text">'어떤' 생각은 결국, 나를 만든다.</p>
    </div>

    <!-- 글쓰기 영역 -->
    <div class="memo-write">
        <input type="text" class="memo-name-input" id="memo-name" placeholder="이름 (익명)" maxlength="20">
        <textarea class="memo-text-input" id="memo-text" placeholder="생각을 남겨주세요..." maxlength="300"></textarea>
        <div class="memo-write-footer">
            <span class="memo-char-count" id="memo-char-count">0 / 300</span>
            <button class="memo-submit" id="memo-submit">남기기</button>
        </div>
    </div>

    <!-- 메모 목록 -->
    <div class="memo-list" id="memo-list">
        <!-- JS로 렌더링 -->
    </div>

</div>

<script src="supabase-config.js"></script>
<script src="auth.js?v=3"></script>
<script src="board.js"></script>

</body>
</html>
