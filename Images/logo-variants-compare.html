<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo variants</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0a0a0a;
    color: #e8e4dc;
    font-family: "Malgun Gothic", sans-serif;
    padding: 28px 36px 44px;
  }
  h1 {
    font-size: 13px;
    font-weight: 600;
    color: #7a7468;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 0 0 24px;
  }
  .row { margin-bottom: 26px; }
  .label {
    font-size: 13px;
    color: #b8a078;
    margin-bottom: 12px;
    letter-spacing: 0.02em;
  }
  .row img {
    display: block;
    width: min(420px, 92vw);
    height: auto;
  }
</style>
</head>
<body>
<h1>Logo compare / dark</h1>
<div class="row">
  <div class="label">0 · Current — curve + three dots</div>
  <img src="logo-saenggak.svg" width="420" height="92" alt="" />
</div>
<div class="row">
  <div class="label">A · Open book + thread</div>
  <img src="logo-variant-book.svg" width="420" height="94" alt="" />
</div>
<div class="row">
  <div class="label">B · Pen nib + ink flow</div>
  <img src="logo-variant-pen.svg" width="420" height="94" alt="" />
</div>
<div class="row">
  <div class="label">C · Notebook margin + golden thread</div>
  <img src="logo-variant-note.svg" width="420" height="94" alt="" />
</div>
</body>
</html>
